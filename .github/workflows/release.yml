name: release

# Build and publish the image on every push to master, then prune
# dangling untagged versions from GHCR.
on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      rollback_tag:
        description: 'GHCR tag to roll back to (e.g. sha-1a2b3c4). Empty = normal build.'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: ${{ github.event.inputs.rollback_tag == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
          # docker/metadata-action sets org.opencontainers.image.version
          # (and revision/created/source) automatically from these.

      - name: Build and push (native amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || github.event.inputs.rollback_tag != '') }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: ROLLBACK_TAG,REPO
          script: |
            cd /root/matrix
            IMG=$(echo "ghcr.io/${REPO}" | tr '[:upper:]' '[:lower:]')
            if [ -n "${ROLLBACK_TAG}" ]; then
              docker pull "${IMG}:${ROLLBACK_TAG}"
              docker tag "${IMG}:${ROLLBACK_TAG}" "${IMG}:latest"
            else
              docker compose pull cake
            fi
            docker compose up -d cake
            docker image prune -f
        env:
          ROLLBACK_TAG: ${{ github.event.inputs.rollback_tag }}
          REPO: ${{ github.repository }}
